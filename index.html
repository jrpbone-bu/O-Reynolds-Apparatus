<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f4f1" />
    <title>Apparatus</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="viewport" aria-label="Interactive 3D apparatus viewer">
      <section id="part-info" aria-label="Selected part" aria-hidden="true">
        <button id="part-info-close" aria-label="Close part information">×</button>
        <strong id="part-info-label"></strong>
        <p id="part-info-purpose"></p>
      </section>
      <div id="loading" role="status" aria-label="Loading apparatus">
        <img src="/apparatus-loading.svg" alt="" width="360" height="507" fetchpriority="high" />
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
